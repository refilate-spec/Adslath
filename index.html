<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adslath — Foundation Architecture (Phase 1)</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <header class="adslath-header">
        <div class="container">
            <h1>Adslath Advertising Ecosystem</h1>
            <p class="subtitle">Phase 1: Ultra Advanced Foundation Architecture & Data Management</p>
        </div>
    </header>

    <main class="container adslath-main">
        <section class="card status-card">
            <h2>System Initialization & Diagnostic Report</h2>
            <div id="diagnostic-output" class="diagnostic-console">
                <p class="loading">Initializing Adslath core modules...</p>
            </div>
        </section>

        <section class="card stats-card">
            <h3>Foundation Inventory Statistics</h3>
            <ul id="stats-list" class="stats-list">
                <!-- Dynamically populated via diagnostic script -->
            </ul>
        </section>
    </main>

    <footer class="adslath-footer">
        <div class="container">
            <p>&copy; 2026 Adslath. Self-Hosted Modular Advertising Network.</p>
        </div>
    </footer>

    <!-- Core Module Initialization (Module Script) -->
    <script type="module">
        import { ADSLATH } from './assets/js/core/namespace.js';
        import './assets/js/core/adslath-config.js';
        import { ADSLATH_DATA } from './assets/js/data/ads-data.js';
        import { DOMAINS_DATA } from './assets/js/data/domains-data.js';
        import { CATEGORIES_DATA } from './assets/js/data/categories-data.js';
        import { CARD_STYLES } from './assets/js/data/card-styles.js';
        import { PLACEMENT_DATA } from './assets/js/data/placement-data.js';
        import { SCHEDULE_DATA } from './assets/js/data/schedule-data.js';
        import { SETTINGS_DATA } from './assets/js/data/settings-data.js';
        import { ValidationUtils } from './assets/js/utils/validation.js';
        import { DataUtils } from './assets/js/utils/data-utils.js';
        import { Logger } from './assets/js/utils/logger.js';

        const logger = new Logger('IndexDiagnostic');
        const output = document.getElementById('diagnostic-output');
        const statsList = document.getElementById('stats-list');

        try {
            logger.info('Starting Adslath Phase 1 Verification Suite.');
            
            // Verify Namespace
            if (!window.ADSLATH || window.ADSLATH.version !== '1.0.0') {
                throw new Error('Namespace initialization failed or version mismatch.');
            }

            // Run structural validation checks
            const adValidation = ValidationUtils.validateAdvertisementList(ADSLATH_DATA.ads);
            const domainValidation = ValidationUtils.validateDomainList(DOMAINS_DATA.domains);

            output.innerHTML = `
                <p class="success">[SUCCESS] Namespace window.ADSLATH initialized cleanly.</p>
                <p class="success">[SUCCESS] Core configuration loaded: ${ADSLATH.config.systemName} v${ADSLATH.config.version}.</p>
                <p class="success">[SUCCESS] Advertisements database verified: ${ADSLATH_DATA.ads.length} records (${adValidation.validCount} valid).</p>
                <p class="success">[SUCCESS] Domain registry verified: ${DOMAINS_DATA.domains.length} domains (${domainValidation.validCount} valid).</p>
                <p class="success">[SUCCESS] Category registry loaded: ${CATEGORIES_DATA.categories.length} categories.</p>
                <p class="success">[SUCCESS] Card presentation styles loaded: ${CARD_STYLES.styles.length} styles.</p>
                <p class="success">[SUCCESS] Placement configurations loaded: ${PLACEMENT_DATA.placements.length} placements.</p>
                <p class="success">[SUCCESS] Campaign schedules loaded: ${SCHEDULE_DATA.schedules.length} campaigns.</p>
                <p class="success">[SUCCESS] Settings & Utilities verified without errors.</p>
            `;

            statsList.innerHTML = `
                <li><strong>Loaded Ads:</strong> ${ADSLATH_DATA.ads.length}</li>
                <li><strong>Registered Domains:</strong> ${DOMAINS_DATA.domains.length}</li>
                <li><strong>Categories:</strong> ${CATEGORIES_DATA.categories.length}</li>
                <li><strong>Card Styles:</strong> ${CARD_STYLES.styles.length}</li>
                <li><strong>Placements:</strong> ${PLACEMENT_DATA.placements.length}</li>
                <li><strong>Active Schedules:</strong> ${SCHEDULE_DATA.schedules.length}</li>
                <li><strong>Debug Mode:</strong> ${ADSLATH.config.debugMode ? 'Enabled' : 'Disabled'}</li>
            `;

            logger.info('Adslath Phase 1 verification completed successfully.');
        } catch (error) {
            logger.error('Verification failed:', error);
            output.innerHTML = `<p class="error">[ERROR] ${error.message}</p>`;
        }
    </script>
</body>
</html>
