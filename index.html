<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adslath — Self-Hosted Ecosystem</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #2563eb; --success: #4ade80; --muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding: 1rem; }
        .container { width: 100%; max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; padding: 1rem 0; }
        header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        header p { color: var(--muted); font-size: 0.875rem; }
        .card { background-color: var(--card); border-radius: 0.5rem; padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card h2 { font-size: 1.125rem; margin-bottom: 0.75rem; }
        .card p { color: var(--muted); font-size: 0.875rem; margin-bottom: 1rem; }
        .dash-btn { display: block; width: 100%; text-align: center; background-color: var(--primary); color: #fff; padding: 0.75rem; border-radius: 0.375rem; text-decoration: none; font-weight: 600; margin-top: 1rem; }
        .console { background: rgba(0,0,0,0.4); padding: 0.75rem; border-radius: 0.375rem; font-family: monospace; font-size: 0.8rem; color: var(--success); overflow-x: auto; line-height: 1.4; }
        footer { text-align: center; margin-top: 2rem; padding: 1rem 0; border-top: 1px solid rgba(255,255,255,0.1); color: var(--muted); font-size: 0.75rem; }
        
        /* Mobile Scaling Fixes */
        @media (max-width: 600px) {
            body { padding: 0.5rem; }
            .card { padding: 1rem; }
            header h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Adslath Ecosystem</h1>
            <p>Self-Hosted Private Ad Network & Modular Engine</p>
        </header>

        <main>
            <section class="card">
                <h2>System Status & Diagnostics</h2>
                <div id="console" class="console">Initializing core modules...</div>
                <a href="dashboard.html" target="_blank" class="dash-btn">Open Management Dashboard &rarr;</a>
            </section>

            <section class="card">
                <h2>Live Ad Placement Demo</h2>
                <p>Universal integration script rendering via local engine:</p>
                <div style="margin-top: 0.75rem;">
                    <script src="assets/js/integration/adslath-loader.js" data-categories="gaming,technology" data-placement="auto" data-card-style="compact" data-theme="dark" data-label="Sponsored"></script>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Adslath. All Rights Reserved.</p>
        </footer>
    </div>

    <script type="module">
        import { ADSLATH } from './assets/js/core/namespace.js';
        import './assets/js/core/adslath-config.js';
        import { ADSLATH_DATA } from './assets/js/data/ads-data.js';

        const consoleEl = document.getElementById('console');
        try {
            if (window.ADSLATH) {
                consoleEl.innerHTML = `[SUCCESS] Namespace window.ADSLATH active.<br>[SUCCESS] Core Version: v${ADSLATH.version}<br>[SUCCESS] Loaded ${ADSLATH_DATA.ads.length} active advertisements.`;
            }
        } catch (e) {
            consoleEl.innerHTML = `[ERROR] Initialization failed: ${e.message}`;
        }
    </script>
</body>
</html>
